events {}

http {
    include /etc/nginx/mime.types;

    # SSL 인증서 경로
    ssl_certificate /etc/letsencrypt/live/minjun-portfolio.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minjun-portfolio.site/privkey.pem;

    # 메인 포트폴리오 (https://minjun-portfolio.site)
    server {
        listen 443 ssl;
        server_name minjun-portfolio.site www.minjun-portfolio.site;

        location / {
            # 아까 연결한 html 폴더를 보여줍니다
            root /usr/share/nginx/html/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    # 쇼핑몰 (https://shop.minjun-portfolio.site)
    server {
        listen 443 ssl;
        server_name shop.minjun-portfolio.site;

        location / {
            # 쇼핑몰 컨테이너로 연결
            proxy_pass http://shop-container:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    

    #리뷰 사이트
    server {
        listen 443 ssl;
        server_name review.minjun-portfolio.site;

        location / {
            root /usr/share/nginx/html/review;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 백엔드 연결
        location /api {
            proxy_pass http://review-server:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS로 강제 이동
    server {
        listen 80;
        server_name *.minjun-portfolio.site minjun-portfolio.site;
        return 301 https://$host$request_uri;
    }
}
